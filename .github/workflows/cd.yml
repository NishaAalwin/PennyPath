name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ env.REPO }}-api:${{ github.ref_name }},ghcr.io/${{ env.REPO }}-api:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: VITE_API_URL=${{ vars.API_URL }}
          tags: ghcr.io/${{ env.REPO }}-web:${{ github.ref_name }},ghcr.io/${{ env.REPO }}-web:latest
  # TODO: add a deploy job once the hosting target is chosen.
