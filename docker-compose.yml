# Secrets come from .env (copy .env.example). They are required: no insecure defaults.
#
# The only published port is the proxy's HTTPS port on loopback. The API and web containers are reachable only
# through it, so the page and the API share one HTTPS origin (https://localhost:8443 by default).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pennypath
      POSTGRES_USER: pennypath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # loopback only: not reachable from other machines
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pennypath"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: Host=db;Database=pennypath;Username=pennypath;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (at least 32 random bytes)}
      Database__MigrateOnStartup: "true"
      # Do not log every SQL statement; fewer details in the logs.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
      # Links in emails (verify email, reset password) point here.
      App__PublicUrl: https://${SITE_ADDRESS:-localhost:8443}
      # Outgoing mail. By default it goes to the local Mailpit catcher (read it at http://127.0.0.1:8025); nothing leaves the machine.
      # For a real mail server set SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_FROM and SMTP_USE_TLS=true in .env.
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__UseTls: ${SMTP_USE_TLS:-false}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-PennyPath <no-reply@pennypath.local>}
      # Trust X-Forwarded-For/-Proto only from the proxy's fixed address, so rate limits and the audit log see the real client.
      ForwardedHeaders__KnownProxies__0: 172.28.0.10
      # Key ring for encrypting stored secrets. It lives on a volume so it survives restarts and rebuilds.
      DataProtection__KeysPath: /var/dpkeys
      # Gmail import. Leave empty to keep the feature off. Create the OAuth client as described in docs/operations.md.
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Google__RedirectUri: ${GOOGLE_REDIRECT_URI:-https://localhost:8443/api/gmail/callback}
    volumes:
      - dpkeys:/var/dpkeys
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Local mail catcher for development: shows the emails the app sends (verification, password reset). Open
  # http://127.0.0.1:8025. Messages are kept in memory only. For real mail, set SMTP_* in .env and remove this service.
  mailpit:
    image: axllent/mailpit:v1.21.8
    user: "65534:65534"
    environment:
      MP_MAX_MESSAGES: "200"
    ports:
      - "127.0.0.1:8025:8025" # the inbox page, loopback only
    expose:
      - "1025" # SMTP, reachable by the API only
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  proxy:
    build: ./proxy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost:8443}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # certificates and the local CA live here
      - caddy_config:/config
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      - api
      - web
    networks:
      default:
        ipv4_address: 172.28.0.10
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # the caddy binary carries this file capability; without it exec fails under cap_drop ALL
    security_opt:
      - no-new-privileges:true

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  dpkeys:
  caddy_data:
  caddy_config:
